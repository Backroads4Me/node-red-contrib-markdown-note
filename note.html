<script type="text/javascript">
  RED.nodes.registerType("note", {
    category: "common",
    // Palette/pre-render color only; per-node color is applied in renderNoteNode.
    color: "#F3E5AB",
    defaults: {
      content: { value: "" },
      bgcolor: { value: "#F3E5AB" },
      textcolor: { value: "#333333" },
      // Persisted rendered height so the label (and therefore Node-RED's
      // height calculation) is correct on the very first draw after a page
      // load, before any measurement has run.
      noteHeight: { value: 0 },
    },
    inputs: 0,
    outputs: 0,
    icon: "font-awesome/fa-file-text-o",
    label: function () {
      return getNoteLabel(this);
    },

    oneditprepare: function () {
      var content = this.content || "";
      var defaultBgColor = "#F3E5AB";
      var defaultTextColor = "#333333";
      var normalizeColor = function (value, fallback) {
        return /^#[0-9a-fA-F]{6}$/.test(value || "") ? value : fallback;
      };

      $("#node-input-bgcolor").val(
        normalizeColor(this.bgcolor, defaultBgColor),
      );
      $("#node-input-textcolor").val(
        normalizeColor(this.textcolor, defaultTextColor),
      );
      $("#node-input-reset-colors")
        .off("click")
        .on("click", function () {
          $("#node-input-bgcolor").val(defaultBgColor);
          $("#node-input-textcolor").val(defaultTextColor);
        });

      this.editor = RED.editor.createEditor({
        id: "node-input-content-editor",
        mode: "ace/mode/markdown",
        value: content,
      });

      this.editor.focus();
    },
    oneditsave: function () {
      if (this.editor) {
        this.content = this.editor.getValue();
        $("#node-input-content").val(this.content);
        this.editor.destroy();
        delete this.editor;
      }
      this.bgcolor = $("#node-input-bgcolor").val() || "#F3E5AB";
      this.textcolor = $("#node-input-textcolor").val() || "#333333";

      var node = this;
      premeasurePendingNote(node);
      hideNoteUntilRendered(node);
      setTimeout(function () {
        if (node._noteRenderPending) {
          renderNoteNode(node);
        }
      }, 300);
    },
    oneditcancel: function () {
      if (this.editor) {
        this.editor.destroy();
        delete this.editor;
      }
    },
    oneditresize: function (size) {
      var rows = $("#dialog-form>div:not(.node-text-editor-row)");
      var height = size.height;
      for (var i = 0; i < rows.length; i++) {
        height -= $(rows[i]).outerHeight(true);
      }
      var editorRow = $("#dialog-form>div.node-text-editor-row");
      var marginTop = parseInt(editorRow.css("marginTop"), 10) || 0;
      var marginBottom = parseInt(editorRow.css("marginBottom"), 10) || 0;
      height -= marginTop + marginBottom;
      $(".node-text-editor").css("height", height + "px");
      if (this.editor) {
        this.editor.resize();
      }
    },
  });

  var renderAllNotesTimer;

  function scheduleAllNotesRender(delay) {
    clearTimeout(renderAllNotesTimer);
    renderAllNotesTimer = setTimeout(function () {
      renderAllNotesTimer = undefined;
      RED.nodes.eachNode(function (node) {
        if (node.type === "note") {
          renderNoteNode(node);
        }
      });
    }, delay);
  }

  RED.events.on("nodes:add", function (node) {
    if (node.type === "note") {
      setTimeout(function () {
        renderNoteNode(node);
      }, 100);
    }
  });

  RED.events.on("nodes:change", function (node) {
    if (node.type === "note") {
      if (node._noteRenderPending) {
        preparePendingNodeForNodeRedRedraw(node);
      }
      requestAnimationFrame(function () {
        if (node._noteRenderPending) {
          renderNoteNode(node, true);
          requestAnimationFrame(function () {
            renderNoteNode(node);
          });
        } else {
          renderNoteNode(node);
        }
      });
    }
  });

  RED.events.on("nodes:remove", function (node) {
    if (node.type === "note") {
      removePendingHideRule(node);
      node._noteRenderPending = false;
    }
  });

  RED.events.on("view:redraw", function () {
    scheduleAllNotesRender(100);
  });

  RED.events.on("workspace:change", function () {
    scheduleAllNotesRender(150);
  });

  RED.events.on("flows:loaded", function () {
    scheduleAllNotesRender(200);
  });

  if (RED.nodes && RED.nodes.eachNode) {
    scheduleAllNotesRender(500);
  }

  function hideNoteUntilRendered(node) {
    node._noteRenderPending = true;
    applyPendingHideRule(node);

    var nodeEl = document.getElementById(node.id);
    if (nodeEl) {
      var g = d3.select(nodeEl);
      if (
        typeof node._noteLeftX !== "number" ||
        typeof node._noteTopY !== "number" ||
        typeof node._noteLastW !== "number" ||
        typeof node._noteLastH !== "number"
      ) {
        captureVisibleNoteGeometry(node);
      }

      g.classed("note-render-pending", true).style("visibility", "hidden");
    }
  }

  function getNodeCssSelector(nodeId) {
    if (window.CSS && typeof window.CSS.escape === "function") {
      return "g#" + window.CSS.escape(String(nodeId));
    }

    var escaped = String(nodeId).replace(
      /[\\\x00-\x1f\x7f"]/g,
      function (character) {
        return "\\" + character.charCodeAt(0).toString(16) + " ";
      },
    );
    return 'g[id="' + escaped + '"]';
  }

  function applyPendingHideRule(node) {
    removePendingHideRule(node);

    var style = document.createElement("style");
    style.textContent =
      getNodeCssSelector(node.id) + " { visibility: hidden !important; }";
    document.head.appendChild(style);
    node._notePendingHideStyle = style;
  }

  function removePendingHideRule(node) {
    if (node._notePendingHideStyle && node._notePendingHideStyle.parentNode) {
      node._notePendingHideStyle.parentNode.removeChild(
        node._notePendingHideStyle,
      );
    }
    delete node._notePendingHideStyle;
  }

  function preparePendingNodeForNodeRedRedraw(node) {
    if (
      typeof node._noteLeftX === "number" &&
      typeof node._noteTopY === "number" &&
      typeof node._noteLastW === "number" &&
      typeof node._noteLastH === "number"
    ) {
      node.w = node._noteLastW;
      node.h = node._noteLastH;
      node.x = node._noteLeftX + node.w / 2;
      node.y = node._noteTopY + node.h / 2;
    }
    node.resize = false;
    applyStableNodeGeometry(node);
  }

  function applyStableNodeGeometry(node) {
    var nodeEl = document.getElementById(node.id);
    if (!nodeEl) return;

    var g = d3.select(nodeEl);
    if (
      typeof node._noteLeftX === "number" &&
      typeof node._noteTopY === "number"
    ) {
      g.attr(
        "transform",
        "translate(" + node._noteLeftX + "," + node._noteTopY + ")",
      );
    }

    var rect = g.select("rect.node");
    if (rect.empty()) rect = g.select("rect");
    if (!rect.empty()) {
      if (typeof node.w === "number") {
        rect.attr("width", node.w);
      }
      if (typeof node.h === "number") {
        rect.attr("height", node.h);
      }
    }
  }

  function processMarkdownContent(rawContent) {
    var sanitized = RED.utils.sanitize(rawContent || "");
    var lines = sanitized.split("\n");
    var processedLines = lines.map(function (line) {
      if (!line.trim()) {
        return "\u00A0";
      }
      return line;
    });
    return processedLines.join("  \n");
  }

  function getNoteLabel(node) {
    var label = node.content ? node.content.replace(/\n/g, "\\n ") : "note";
    var targetHeight = node._noteLabelTargetH;
    if (typeof targetHeight !== "number") {
      targetHeight = node.noteHeight > 0 ? node.noteHeight : undefined;
    }
    if (typeof targetHeight !== "number") {
      return label;
    }

    var lineCount = getNoteLabelLineCount(node);
    var targetLineCount = Math.max(1, Math.ceil((targetHeight - 6) / 24));
    var paddingLines = targetLineCount - lineCount;
    while (paddingLines > 0) {
      label += "\\n ";
      paddingLines--;
    }
    return label;
  }

  function getNoteLabelLineCount(node) {
    var label = node.content ? node.content.replace(/\n/g, "\\n ") : "note";
    return label.split(/\\n /).length;
  }

  function getNoteLabelLines(node) {
    var label = node.content ? node.content.replace(/\n/g, "\\n ") : "note";
    return label.split(/\\n /).map(function (line) {
      return line.trim();
    });
  }

  function getNodeRedCompatibleHeight(actualHeight, node) {
    var measuredLineCount = Math.max(1, Math.ceil((actualHeight - 6) / 24));
    var contentLineCount = node ? getNoteLabelLineCount(node) : 1;
    var lineCount = Math.max(measuredLineCount, contentLineCount);
    return Math.max(6 + 24 * lineCount, 30);
  }

  function measureNodeRedLabelWidth(node) {
    var target = document.getElementById("red-ui-editor") || document.body;
    var measure = document.createElement("span");
    measure.className = "red-ui-flow-node-label";
    measure.style.position = "absolute";
    measure.style.left = "-10000px";
    measure.style.top = "-10000px";
    measure.style.visibility = "hidden";
    target.appendChild(measure);

    var maxWidth = 0;
    getNoteLabelLines(node).forEach(function (line) {
      measure.textContent = line || "";
      maxWidth = Math.max(maxWidth, measure.offsetWidth);
    });
    measure.parentNode.removeChild(measure);
    return maxWidth;
  }

  function getNodeRedCompatibleWidth(node) {
    var labelWidth = measureNodeRedLabelWidth(node);
    return Math.max(100, 20 * Math.ceil((labelWidth + 50) / 20));
  }

  function premeasurePendingNote(node) {
    captureVisibleNoteGeometry(node);

    var inset = 1;
    var width = getNodeRedCompatibleWidth(node);
    var measure = document.createElement("div");
    measure.className = "note-node-content note-measure-content";
    measure.style.position = "absolute";
    measure.style.left = "-10000px";
    measure.style.top = "-10000px";
    measure.style.visibility = "hidden";
    measure.style.width = width - inset * 2 + "px";
    measure.style.overflow = "hidden";
    measure.style.pointerEvents = "none";
    measure.innerHTML = RED.utils.renderMarkdown(
      processMarkdownContent(node.content),
    );
    document.body.appendChild(measure);

    var minHeight = 28;
    var actualHeight = Math.max(measure.scrollHeight + inset * 2, minHeight);
    var finalHeight = getNodeRedCompatibleHeight(actualHeight, node);

    measure.parentNode.removeChild(measure);

    if (typeof node._noteLeftX !== "number") {
      node._noteLeftX = node.x - width / 2;
    }
    if (typeof node._noteTopY !== "number") {
      var lastHeight =
        typeof node._noteLastH === "number"
          ? node._noteLastH
          : typeof node.h === "number"
            ? node.h
            : finalHeight;
      node._noteTopY = node.y - lastHeight / 2;
    }

    node.w = width;
    node.h = finalHeight;
    node.x = node._noteLeftX + width / 2;
    node.y = node._noteTopY + finalHeight / 2;
    node._noteLastW = width;
    node._noteLastH = finalHeight;
    node._noteLastX = node.x;
    node._noteLastY = node.y;
    node._noteLabelTargetH = finalHeight;
    node.noteHeight = finalHeight;
    node.resize = false;
    applyStableNodeGeometry(node);
  }

  function captureVisibleNoteGeometry(node) {
    var nodeEl = document.getElementById(node.id);
    if (!nodeEl) return;

    var g = d3.select(nodeEl);
    var transform = g.attr("transform") || "";
    var translate = /translate\(\s*([-\d.]+)[ ,]+([-\d.]+)\s*\)/.exec(
      transform,
    );
    var rect = g.select("rect.node");
    if (rect.empty()) rect = g.select("rect");
    if (!rect.empty()) {
      var bbox = rect.node().getBBox();
      node._noteLastW = bbox.width;
      node._noteLastH = bbox.height;
    }
    if (translate) {
      node._noteLeftX = parseFloat(translate[1]);
      node._noteTopY = parseFloat(translate[2]);
    }
    if (
      typeof node._noteLeftX === "number" &&
      typeof node._noteTopY === "number" &&
      typeof node._noteLastW === "number" &&
      typeof node._noteLastH === "number"
    ) {
      node._noteLastX = node._noteLeftX + node._noteLastW / 2;
      node._noteLastY = node._noteTopY + node._noteLastH / 2;
    }
  }

  function renderNoteNode(node, keepHidden) {
    var nodeEl = document.getElementById(node.id);
    if (!nodeEl) {
      if (node._noteRenderPending) {
        removePendingHideRule(node);
        node._noteRenderPending = false;
      }
      return;
    }

    var g = d3.select(nodeEl);
    var restoreVisibility = function () {
      if (node._noteRenderPending && !keepHidden) {
        g.classed("note-render-pending", false).style("visibility", null);
        removePendingHideRule(node);
        node._noteRenderPending = false;
      }
    };

    try {
      if (node._noteRenderPending) {
        applyPendingHideRule(node);
        g.classed("note-render-pending", true).style("visibility", "hidden");
      }

      if (typeof node.h !== "number" || typeof node.y !== "number") {
        return;
      }

      var rect = g.select("rect.node");
      if (rect.empty()) rect = g.select("rect");
      if (rect.empty()) {
        return;
      }

      var bgcolor = node.bgcolor || "#F3E5AB";
      var textcolor = node.textcolor || "#333333";

      var bbox = rect.node().getBBox();
      var w = bbox.width;
      var inset = 1;
      rect.style("fill", bgcolor).style("fill-opacity", 1);

      // Skip the full overlay rebuild when nothing observable has changed.
      // view:redraw fires on every canvas interaction, so this is the hot path.
      var renderSig = JSON.stringify([node.content || "", bgcolor, textcolor]);
      if (
        !node._noteRenderPending &&
        node._noteRenderSig === renderSig &&
        !g.select(".note-overlay").empty() &&
        node._noteLastW === w &&
        node._noteLastH === node.h &&
        node._noteLastX === node.x &&
        node._noteLastY === node.y
      ) {
        return;
      }

      g.selectAll(".note-overlay").remove();
      g.classed("note-hidden-content", true);

      var html;
      if (node._noteRenderSig === renderSig && node._noteHtmlCache) {
        html = node._noteHtmlCache;
      } else {
        html = RED.utils.renderMarkdown(
          processMarkdownContent(node.content || ""),
        );
      }
      node._noteHtmlCache = html;
      node._noteRenderSig = renderSig;

      var fo = g
        .append("foreignObject")
        .attr("class", "note-overlay")
        .attr("x", inset)
        .attr("y", inset)
        .attr("width", w - inset * 2)
        .attr("height", node.h - inset * 2)
        .attr("pointer-events", "none");

      var contentDiv = fo
        .append("xhtml:div")
        .attr("class", "note-node-content")
        .attr("xmlns", "http://www.w3.org/1999/xhtml")
        .style("width", w - inset * 2 + "px")
        .style("overflow", "hidden")
        .style("color", textcolor)
        .html(html);

      var contentNode = contentDiv.node();
      if (contentNode) {
        var minHeight = 28;
        var actualHeight = Math.max(
          contentNode.scrollHeight + inset * 2,
          minHeight,
        );
        var finalHeight = getNodeRedCompatibleHeight(actualHeight, node);

        rect.attr("height", finalHeight);
        fo.attr("height", finalHeight - inset * 2);
        contentDiv.style("height", finalHeight - inset * 2 + "px");

        var currentH =
          typeof node._noteLastH === "number"
            ? node._noteLastH
            : typeof node.h === "number"
              ? node.h
              : finalHeight;
        var currentW =
          typeof node._noteLastW === "number"
            ? node._noteLastW
            : typeof node.w === "number"
              ? node.w
              : w;

        var dx =
          typeof node._noteLastX === "number" ? node.x - node._noteLastX : 0;
        var dy =
          typeof node._noteLastY === "number" ? node.y - node._noteLastY : 0;
        var MOVE_TOLERANCE = 12;
        var movedX = !node._noteRenderPending && Math.abs(dx) > 0.5;
        var movedY = !node._noteRenderPending && Math.abs(dy) > MOVE_TOLERANCE;

        if (typeof node._noteTopY !== "number") {
          // First render this session: derive the anchor from the persisted
          // center and the measured height.
          node._noteTopY = node.y - finalHeight / 2;
        } else if (movedX || movedY) {
          node._noteTopY = node.y - currentH / 2;
        }

        if (typeof node._noteLeftX !== "number") {
          node._noteLeftX = node.x - w / 2;
        } else if (movedX || movedY) {
          node._noteLeftX = node.x - currentW / 2;
        }

        node.x = node._noteLeftX + w / 2;
        node.y = node._noteTopY + finalHeight / 2;
        node.w = w;
        node.h = finalHeight;
        node._noteLastW = w;
        node._noteLastH = finalHeight;
        node._noteLastX = node.x;
        node._noteLastY = node.y;
        node._noteLabelTargetH = finalHeight;
        node.noteHeight = finalHeight;

        var transform = g.attr("transform") || "";
        var translate = /translate\(\s*([-\d.]+)[ ,]+([-\d.]+)\s*\)/.exec(
          transform,
        );
        if (translate) {
          g.attr(
            "transform",
            "translate(" + node._noteLeftX + "," + node._noteTopY + ")",
          );
        }
      }
    } finally {
      restoreVisibility();
    }
  }
</script>

<script type="text/html" data-template-name="note">
  <div class="form-row note-color-row">
    <label for="node-input-bgcolor">Background</label>
    <input type="color" id="node-input-bgcolor" />
    <label for="node-input-textcolor">Text</label>
    <input type="color" id="node-input-textcolor" />
    <button type="button" id="node-input-reset-colors" class="red-ui-button">
      Reset
    </button>
  </div>
  <div class="form-row node-text-editor-row">
    <input type="hidden" id="node-input-content" />
    <div
      class="node-text-editor note-content-editor"
      id="node-input-content-editor"
    ></div>
  </div>
</script>

<script type="text/html" data-help-name="note">
  <p>Displays an editor-only, markdown-formatted note on the flow canvas.</p>
  <h3>Details</h3>
  <p>
    Use this node to add documentation, instructions, or annotations directly in
    your Node-RED flows.
  </p>
  <p>Double-click to edit and enter markdown syntax directly:</p>
  <ul>
    <li><b>Headers:</b> # H1, ## H2, ### H3</li>
    <li><b>Bold:</b> **text**</li>
    <li><b>Italic:</b> _text_</li>
    <li><b>Code:</b> `code`</li>
    <li><b>Lists:</b> - item or 1. item</li>
    <li><b>Links:</b> [text](url)</li>
    <li><b>Quote:</b> > text</li>
  </ul>
  <p>Links are displayed but are not clickable on the flow canvas.</p>
</script>

<style>
  .note-color-row {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .form-row.note-color-row label {
    width: auto !important;
    min-width: 0;
    margin-right: 6px;
    margin-bottom: 0;
  }

  .note-color-row input[type="color"] {
    flex: 0 0 auto;
    width: 60px;
    height: 28px;
    padding: 1px;
    cursor: pointer;
    margin-right: 16px;
  }

  .note-color-row button {
    margin-left: 16px;
  }

  .note-content-editor {
    height: 250px;
    min-height: 150px;
  }

  g.note-hidden-content .note-node-content,
  .note-measure-content {
    font-size: 14px;
    line-height: 1.5;
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 0 8px;
    border-radius: 4px;
  }

  g.note-hidden-content .note-node-content h1,
  .note-measure-content h1 {
    font-size: 18px;
    font-weight: bold;
    margin: 0 0 8px 0;
    border-bottom: 1px solid currentColor;
    padding-bottom: 4px;
  }

  g.note-hidden-content .note-node-content h2,
  .note-measure-content h2 {
    font-size: 16px;
    font-weight: bold;
    margin: 8px 0 6px 0;
  }

  g.note-hidden-content .note-node-content h3,
  .note-measure-content h3 {
    font-size: 15px;
    font-weight: bold;
    margin: 6px 0 4px 0;
  }

  g.note-hidden-content .note-node-content p,
  .note-measure-content p {
    margin: 4px 0;
  }

  g.note-hidden-content .note-node-content ul,
  g.note-hidden-content .note-node-content ol,
  .note-measure-content ul,
  .note-measure-content ol {
    margin: 4px 0;
    padding-left: 18px;
  }

  g.note-hidden-content .note-node-content li,
  .note-measure-content li {
    margin: 2px 0;
  }

  g.note-hidden-content .note-node-content code,
  .note-measure-content code {
    background: rgba(0, 0, 0, 0.08);
    color: inherit;
    padding: 2px 5px;
    border-radius: 2px;
    font-family: monospace;
    font-size: 13px;
  }

  g.note-hidden-content .note-node-content pre,
  .note-measure-content pre {
    background: rgba(0, 0, 0, 0.08);
    padding: 3px;
    border-radius: 2px;
    overflow-x: auto;
    margin: 2px 0;
  }

  g.note-hidden-content .note-node-content pre code,
  .note-measure-content pre code {
    background: none;
    padding: 0;
  }

  g.note-hidden-content .note-node-content a,
  .note-measure-content a {
    color: #0066cc;
    text-decoration: underline;
  }

  g.note-hidden-content .note-node-content blockquote,
  .note-measure-content blockquote {
    border-left: 2px solid currentColor;
    margin: 2px 0;
    padding-left: 6px;
    font-style: italic;
  }

  g.note-hidden-content text,
  g.note-hidden-content .node_icon_group,
  g.note-hidden-content .red-ui-flow-node-icon-group,
  g.note-hidden-content .red-ui-flow-node-icon-shade,
  g.note-hidden-content .node_icon,
  g.note-hidden-content image {
    display: none !important;
    visibility: hidden !important;
  }

  g.note-render-pending {
    visibility: hidden;
  }
</style>

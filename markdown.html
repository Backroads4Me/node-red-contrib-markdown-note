<script type="text/javascript">
    RED.nodes.registerType('note', {
        category: 'common',
        color: '#F3E5AB',
        defaults: {
            content: { value: '' }
        },
        inputs: 0,
        outputs: 0,
        icon: 'font-awesome/fa-file-text-o',
        label: function() {
            // Convert actual newlines to literal \n that Node-RED interprets as line breaks
            if (this.content) {
                var label = this.content.replace(/\n/g, '\\n ');
                return label;
            }
            return 'note';
        },
        info: function() {
            // Show content in Info sidebar when node is selected
            return this.content || '';
        },
        oneditprepare: function() {
            var content = this.content || '';

            // Create the ACE editor with markdown mode (Node-RED provides toolbar)
            this.editor = RED.editor.createEditor({
                id: 'node-input-content-editor',
                mode: 'ace/mode/markdown',
                value: content
            });

            this.editor.focus();
        },
        oneditsave: function() {
            this.content = this.editor.getValue();
            $("#node-input-content").val(this.content);
            this.editor.destroy();
            delete this.editor;
        },
        oneditcancel: function() {
            this.editor.destroy();
            delete this.editor;
        },
        oneditresize: function(size) {
            var rows = $("#dialog-form>div:not(.node-text-editor-row)");
            var height = $("#dialog-form").height();
            for (var i = 0; i < rows.length; i++) {
                height -= $(rows[i]).outerHeight(true);
            }
            var editorRow = $("#dialog-form>div.node-text-editor-row");
            height -= (parseInt(editorRow.css("marginTop")) + parseInt(editorRow.css("marginBottom")));
            $(".node-text-editor").css("height", height + "px");
            this.editor.resize();
        }
    });

    // Render markdown content inside nodes on the workspace
    RED.events.on("nodes:add", function(node) {
        if (node.type === "note") {
            setTimeout(function() { renderNoteNode(node); }, 100);
        }
    });

    RED.events.on("nodes:change", function(node) {
        if (node.type === "note") {
            // Longer delay after changes to allow Node-RED to recalculate size
            setTimeout(function() { renderNoteNode(node); }, 150);
        }
    });

    RED.events.on("view:redraw", function() {
        setTimeout(function() {
            RED.nodes.eachNode(function(node) {
                if (node.type === "note") {
                    renderNoteNode(node);
                }
            });
        }, 50);
    });

    function renderNoteNode(node) {
        var nodeEl = document.getElementById(node.id);
        if (!nodeEl) return;

        var g = d3.select(nodeEl);

        // Remove any existing markdown overlay
        g.selectAll(".note-overlay").remove();

        // Hide the default label text and any visual separators
        g.selectAll("text")
            .style("fill", "transparent")
            .style("fill-opacity", "0")
            .style("stroke", "transparent")
            .style("stroke-opacity", "0")
            .style("opacity", "0")
            .style("display", "none");

        // Hide any separator lines, paths, or other visual elements
        g.selectAll("line").style("display", "none");
        g.selectAll("path").each(function() {
            var path = d3.select(this);
            // Don't hide the main node outline
            if (!path.classed("node-outline")) {
                path.style("display", "none");
            }
        });
        g.selectAll(".node-label-spacer").style("display", "none");

        // Get the node's actual bounding box (auto-sized by Node-RED based on label)
        var rect = g.select("rect").node();
        if (!rect) return;

        var bbox = rect.getBBox();
        var w = bbox.width;
        var h = bbox.height;

        // Render markdown to HTML using Node-RED's built-in utility
        var html = RED.utils.renderMarkdown(RED.utils.sanitize(node.content || ''));

        // Create foreignObject to hold the HTML content
        var fo = g.append("foreignObject")
            .attr("class", "note-overlay")
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", w)
            .attr("height", h)
            .attr("pointer-events", "none");

        fo.append("xhtml:div")
            .attr("class", "note-node-content")
            .attr("xmlns", "http://www.w3.org/1999/xhtml")
            .style("width", w + "px")
            .style("height", h + "px")
            .style("overflow", "hidden")
            .html(html);
    }
</script>

<script type="text/html" data-template-name="note">
    <div class="form-row node-text-editor-row">
        <input type="hidden" id="node-input-content">
        <div style="height: 250px; min-height:150px;" class="node-text-editor" id="node-input-content-editor"></div>
    </div>
</script>

<script type="text/html" data-help-name="note">
    <p>A node for displaying markdown-formatted notes in your flow.</p>
    <h3>Usage</h3>
    <p>Use this node to add documentation, instructions, or annotations directly in your Node-RED flows.</p>
    <p>Double-click to edit. Use the toolbar buttons or type markdown syntax directly:</p>
    <ul>
        <li><b>Headers:</b> # H1, ## H2, ### H3</li>
        <li><b>Bold:</b> **text**</li>
        <li><b>Italic:</b> _text_</li>
        <li><b>Code:</b> `code`</li>
        <li><b>Lists:</b> - item or 1. item</li>
        <li><b>Links:</b> [text](url)</li>
        <li><b>Quote:</b> > text</li>
    </ul>
    <p>Content appears in the Info sidebar when the node is selected.</p>
</script>
